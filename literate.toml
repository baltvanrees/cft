  "CFT.LightconeBootstrap.MonomialDecomp",
  "CFT.LightconeBootstrap.Gap",
  "CFT.LightconeBootstrap.RealLaplaceBound",
  "CFT.LightconeBootstrap.QuantitativeLargeSpin",
  "CFT.LightconeBootstrap.Transmute1d",
  "CFT.LightconeBootstrap.LightconeBlockDecomp",
  "CFT.LightconeBootstrap.TransmutedRealLaplace",
  "CFT.LightconeBootstrap.TransmutedEndpointBounds",
  "CFT.LightconeBootstrap.ExactTransmutedRef",
  "CFT.LightconeBootstrap.TransmutedCrossing",
  "CFT.LightconeBootstrap.PrimaryAllTwists",
]
"CFT.ConeTauberian" = [
